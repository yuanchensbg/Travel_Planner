res","sub":"Ausschlafen, Fähre und der erste Strandtag","intro":"Ein ganzer Tag zum Ankommen: Mit der Fähre geht es nach Isla Mujeres. Bummel durch den bunten Inselort, mit dem Taxi zu den Klippen der Punta Sur und nachmittags an die Playa Norte — perfekt, um den Jetlag auszukurieren.","prog":[{"id":"d1bn0","time":"08:00","text":"Frühstück — wegen des Jetlags ohnehin früh wach","place":"","desc":"","cost":"","tip":"","dur":"1 h"},{"id":"d1bn1","time":"09:00","text":"Fähre ab Puerto Juárez nach Isla Mujeres (~20 Min)","place":"Ultramar Puerto Juárez","desc":"Fähren fahren etwa alle 30 Minuten. Das Auto bleibt auf dem bewachten Parkplatz am Terminal.","cost":"ca. MXN 400–600 p.P. hin & zurück","tip":"","dur":"45 Min"},{"id":"d1bn2","time":"09:45","text":"Bummel durch den Inselort und am Malecón","place":"Isla Mujeres Centro","desc":"Bunte Gassen, Kunsthandwerk, kleine Cafés und ein Uferweg an der Ostseite der Insel.","cost":"gratis","tip":"","dur":"1 h 45 Min"},{"id":"d1bn3","time":"11:30","text":"Mit dem Taxi zur Punta Sur: Klippen, Leuchtturm, Skulpturen","place":"Punta Sur, Isla Mujeres","desc":"Südspitze der Insel mit Steilküste, Leuchtturm, kleinem Maya-Heiligtum der Ixchel und Skulpturen über dem Meer.","cost":"kleiner Eintritt · Taxi vor Ort (Festpreis erfragen)","tip":"","dur":"2 h"},{"id":"d1bn4","time":"13:30","text":"Mittagessen: Fisch und Ceviche","place":"","desc":"","cost":"","tip":"","dur":"1 h 30 Min"},{"id":"d1bn5","time":"15:00","text":"Playa Norte: baden und Sonnenuntergang","place":"Playa Norte, Isla Mujeres","desc":"Flacher, ruhiger Strand mit türkisem Wasser im Norden der Insel — ideal zum Ausruhen.","cost":"gratis","tip":"","dur":"3 h"},{"id":"d1bn6","time":"18:00","text":"Fähre zurück, Abendessen in Cancún","place":"","desc":"","cost":"","tip":"","dur":""}],"night":"Cancún","ll":[21.1619,-86.8515],"route":"Cancún ↔ Isla Mujeres (Fähre)","km":10,"dur":"~20 Min Fähre","ent":"Fähre ca. MXN 400–600 p.P. hin & zurück · Taxi zur Punta Sur","tip":"Morgens früh die Fähre nehmen — der Jetlag weckt euch ohnehin, und die Insel ist dann noch ruhig.","must":["Punta Sur","Playa Norte","Bunter Inselort"],"food":["Tikin Xic & Ceviche","Fischlokale im Ort — frischer Fang direkt am Wasser."],"land":"Mexiko","alts":[["Golfwagen mieten","Preis variiert","Die übliche Art, die Insel zu erkunden."],["Schildkrötenstation","Preis variiert","Aufzuchtstation für Meeresschildkröten auf der Insel."],["Isla Contoy","Preis variiert","Vogelschutzinsel, nur mit lizenzierten Touren."],["Ruta de los Cenotes","Preis variiert","Letzter Cenote-Ausflug bei Puerto Morelos."],["Riff-Schnorcheln Puerto Morelos","Preis variiert","Geschütztes Riff direkt vor der Küste."],["Spa-Tag","Preis variiert","Entspannung vor dem langen Flug."],["La Isla Shopping","gratis","Einkaufszentrum an der Lagune in der Hotelzone."],["Sonnenuntergang an der Lagune","gratis","Abschiedsabend mit Blick auf die Laguna Nichupté."],["MUSA Unterwassermuseum","Preis variiert","Skulpturen unter Wasser, per Schnorchel- oder Glasbodenboot."],["Playa Delfines","gratis","Öffentlicher Strand in der Hotelzone mit dem bunten Cancún-Schriftzug und weitem Blick über die Karibik."]],"legs":[{"art":"Mietwagen","von":"Hotel Cancún","nach":"Puerto Juárez","o":"21.1619,-86.8515","d":"21.1840,-86.8080","dauer":"~15 Min","nav":true},{"art":"Fähre","von":"Puerto Juárez","nach":"Isla Mujeres","o":"21.1840,-86.8080","d":"21.2581,-86.7469","dauer":"~20 Min","nav":false}]},{"t":3,"id":"dbac","date":"19.12.2026","wd":"Sa","L":"A","title":"→ Bacalar","sub":"Die Küste hinunter zur Lagune der sieben Farben","intro":"Ein Fahrtag die Karibikküste hinunter und durch den Dschungel bis an die Lagune von Bacalar. Am Nachmittag ins tiefblaue Wasser des Cenote Azul, abends geht die Sonne über dem Steg unter.","prog":[{"id":"dbacn0","time":"08:00","text":"Frühstück, Abfahrt nach Süden (~4 h)","place":"","desc":"","cost":"","tip":"","dur":"4 h"},{"id":"dbacn1","time":"12:00","text":"Mittagessen unterwegs oder in
