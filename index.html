  const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] }) });
  const j = await r.json(); return JSON.parse((j.content || []).map((c) => c.text || '').join('').replace(/```json|```/g, '').trim());
}
async function aiDetails(d, answers) {
  const v = readItemForm(), box = $('#i-ai-box'); if (!v.text) return toast('Bitte zuerst eintragen, was ihr macht');
  box.innerHTML = '<p class="meta">Suche Details …</p>';
  const ctx = `Reisetag ${d.t}, ${d.date}: ${d.title}. Übernachtung: ${d.night}, ${d.land}. Tagesablauf: ${d.prog.map((p) => p.time + ' ' + p.text).join('; ')}.`;
  const qa = answers.length ? '\nAntworten auf deine Rückfragen:\n' + answers.map(([q, a]) => `- ${q}: ${a}`).join('\n') : '';
  const prompt = `Du ergänzt Details für einen Programmpunkt einer Reise für zwei Personen. ${ctx}\nProgrammpunkt: "${v.text}" um ${v.time || 'unbekannte Uhrzeit'}${v.place ? ', Ort: ' + v.place : ''}.${qa}\n\n` +
    `Wenn nicht eindeutig ist, welcher konkrete Ort oder Anbieter gemeint ist, oder dir wichtige Angaben fehlen, stelle 1 bis 3 kurze Rückfragen und liefere noch keine Details. Erfinde keine Preise, Adressen oder Öffnungszeiten — was du nicht sicher weißt, lass leer. ` +
    `Antworte NUR mit JSON ohne Markdown, entweder {"fragen":["…"]} oder {"details":{"ort":"Name, Ort","beschreibung":"1–2 Sätze auf Deutsch","dauer":"","kosten":"ca. … oder leer","tipp":"","sicherheit":"hoch|mittel|niedrig"}}`;
  try {
    const o = await claude(prompt);
    if (o.fragen && o.fragen.length) {
      box.innerHTML = `<div class="result"><b>Bevor ich etwas eintrage, ein paar Fragen:</b>${o.fragen.map((q, k) => `<div class="row"><label for="aq${k}">${esc(q)}</label><input id="aq${k}" data-q="${esc(q)}"></div>`).join('')}
        <div class="actions"><button type="button" class="btn primary" id="aq-go">Antworten senden</button></div></div>`;
      $('#aq-go').onclick = () => aiDetails(d, [...answers, ...$$('#i-ai-box input').map((x) => [x.dataset.q, x.value.trim() || 'weiß nicht'])]);
      return;
    }
    const x = o.details || {};
    box.innerHTML = `<div class="result"><b>Vorschlag ${x.sicherheit ? `(Sicherheit: ${esc(x.sicherheit)})` : ''}</b><br>${x.ort ? `Ort: ${esc(x.ort)}<br>` : ''}${x.beschreibung ? esc(x.beschreibung) + '<br>' : ''}${x.dauer ? `Dauer: ${esc(x.dauer)}<br>` : ''}${x.kosten ? `Kosten: ${esc(x.kosten)}<br>` : ''}${x.tipp ? `Tipp: ${esc(x.tipp)}` : ''}
      <p class="meta small" style="margin:8px 0 0">Bitte prüfen. Erst „Übernehmen“ trägt es in die Felder ein, dann noch „Speichern“.</p>
      <div class="actions"><button type="button" class="btn primary" id="ai-ok">Übernehmen</button><button type="button" class="btn" id="ai-no">Verwerfen</button></div></div>`;
    $('#ai-ok').onclick = () => { if (x.ort) $('#i-place').value = x.ort; if (x.beschreibung) $('#i-desc').value = x.beschreibung; if (x.dauer) $('#i-dur').value = x.dauer; if (x.kosten) $('#i-cost').value = x.kosten; if (x.tipp) $('#i-tip').value = x.tipp; box.innerHTML = ''; toast('Übernommen — jetzt prüfen und speichern'); };
    $('#ai-no').onclick = () => { box.innerHTML = ''; };
  } catch (e) { box.innerHTML = '<div class="result">Die KI-Suche funktioniert nur in der Claude-App. Hier kannst du die Details selbst eintragen.</div>'; }
}

/* ================= Ausgaben mit Aufteilung & Rückzahlungen ================= */
function shares(x) {
  const v = eurOf(x), p = x.payer;
  if (x.split === 'beide') return [v / 2, v / 2];
  if (x.split === 'selbst') return p === 0 ? [v, 0] : [0, v];
  if (x.split === 'andere') return p === 0 ? [0, v] : [v, 0];
  if (x.split === 'prozent') { const a = Math.min(100, Math.max(0, +x.pct || 0)) / 100; return [v * a, v * (1 - a)]; }
  if (x.split === 'betrag') { const a = Math.min(x.amount, Math.max(0, +x.amt0 || 0)) / x.amount; return [v * a, v * (1 - a)]; }
  return [v / 2, v / 2];
}
function balance() {
  const ex = live(S.expenses); let b = 0;
  ex.forEach((x) => { const [s0] = shares(x); const v = eurOf(x); b += (x.payer === 0 ? v : 0) - s0; });
  live(S.repay).filter((r) => r.done).forEach((r) => { b += r.from === 0 ? r.eur : -r.eur; });
  return b;  // > 0: Person 2 schuldet Person 1
}
function splitText(x) { const [A, B] = S.settings.names;
  return { beide: 'geteilt', selbst: 'nur für ' + S.settings.names[x.payer], andere: 'für ' + S.settings.names[1 - x.payer], prozent: `${A} ${+x.pct || 0} %, ${B} ${100 - (+x.pct || 0)} %`, betrag: `${A} ${(+x.amt0 || 0).toLocaleString('de-DE')} ${x.cur}, ${B} ${(x.amount - (+x.amt0 || 0)).toLocaleString('de-DE')} ${x.cur}` }[x.split] || 'geteilt'; }
const pn = (i) => `<span class="pn${i}">${esc(S.settings.names[i])}</span>`;
const sgn = (v) => (v > 0.005 ? '+' : v < -0.005 ? '−' : '±') + fmtE(Math.abs(v));
function oweText(n0, quitt) { if (Math.abs(n0) < 0.5) return quitt || 'Ihr seid quitt.';
  return n0 > 0 ? `${pn(1)} schuldet ${pn(0)} <b>${fmtE(n0)}</b>` : `${pn(0)} schuldet ${pn(1)} <b>${fmtE(-n0)}</b>`; }
